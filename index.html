<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Documento com Logo</title>
    <style>
        @page {
            size: A4;
            margin: 20mm 15mm;
            background-color: #ffffff;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333333;
            line-height: 1.5;
        }
        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #ea2027;
            margin-bottom: 25px;
        }
        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 12px;
        }
        .title {
            font-size: 20pt;
            font-weight: bold;
            color: #1e272e;
            margin: 10px 0 5px 0;
        }
        .subtitle {
            font-size: 11pt;
            color: #718093;
            margin: 0;
        }
        .content {
            font-size: 11pt;
            margin-top: 20px;
        }
        .card {
            background-color: #f8f9fa;
            border-left: 4px solid #ea2027;
            padding: 15px;
            margin-top: 15px;
            border-radius: 0 4px 4px 0;
        }
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 20px;">
  <img src="https://i.imgur.com/8Qp2o8g.png" alt="Logo" style="max-width: 200px; height: auto;" />
  <h2>Documento Atualizado</h2>
</div>

    <div class="content">
        <p>Este documento foi atualizado para garantir que a imagem da logo seja renderizada perfeitamente.</p>
    </div>
</body>
</html>
