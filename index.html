<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido de Oração - PIBVL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --navy: #182A5C;
      --navy-deep: #101d42;
      --sky: #35A6DE;
      --sky-light: #7FCBEE;
      --ivory: #FAF9F5;
      --ivory-warm: #F2EFE6;
      --ink: #1B2340;
      --ink-soft: #55607E;
      --line: #E4E1D6;
      --ok: #2E7D5B;
      --wsp: #25D366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      background-image:
        radial-gradient(circle at 12% 8%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 38%),
        linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 45%, var(--sky) 100%);
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 16px 20px;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
    }

    .card {
      background: var(--ivory);
      border-radius: 18px;
      box-shadow: 0 30px 60px -20px rgba(9,20,50,0.45), 0 2px 0 rgba(255,255,255,0.4) inset;
      overflow: hidden;
      position: relative;
    }

    .card-head {
      background: linear-gradient(150deg, var(--navy-deep) 0%, var(--navy) 55%, var(--sky) 130%);
      padding: 36px 30px 30px;
      text-align: center;
      color: #fff;
      position: relative;
    }

    /* Acesso discreto (Menu de 3 pontos no topo superior direito) */
    .top-menu-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: rgba(255, 255, 255, 0.85);
      font-size: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s ease;
    }
    .top-menu-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }
